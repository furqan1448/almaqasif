<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام وحدة المقاصف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="logo-config.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot" id="brandDot"></span><img class="logo-img hidden" id="brandLogo" alt="شعار فرقان"> وحدة المقاصف</div>
  </div>

  <div class="wrap" style="max-width:480px;">
    <h1 style="text-align:center;color:var(--maroon);margin-top:10px;">أهلاً بك</h1>
    <p style="text-align:center;color:#8a7d76;margin-top:-6px;">اختاري نوع الدخول للمتابعة</p>

    <div class="role-grid">
      <a class="role-card" href="marakez.html">
        <div class="ic">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5 4.5 4h15L21 9.5"/><path d="M3 9.5a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0"/>
            <path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/>
          </svg>
        </div>
        <div class="title">دخول إدارة المراكز</div>
        <div style="font-size:0.85rem;color:#8a7d76;margin-top:6px;"></div>
      </a>

      <a class="role-card" href="masoulat.html">
        <div class="ic">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="3.4"/><path d="M5 20c.7-3.8 3.6-6 7-6s6.3 2.2 7 6"/>
          </svg>
        </div>
        <div class="title">دخول مسؤولات المقاصف</div>
        <div style="font-size:0.85rem;color:#8a7d76;margin-top:6px;"></div>
      </a>

      <a class="role-card" href="edara.html">
        <div class="ic">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 21V6.5L12 3l8 3.5V21"/><path d="M4 21h16"/><path d="M9.5 21v-5h5v5"/>
            <path d="M8.5 9h.01M12 9h.01M15.5 9h.01M8.5 13h.01M15.5 13h.01"/>
          </svg>
        </div>
        <div class="title">إدارة وحدة المقاصف</div>
        <div style="font-size:0.85rem;color:#8a7d76;margin-top:6px;"></div>
      </a>

      <a class="role-card" href="eshraf.html">
        <div class="ic">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 4 6.5v5c0 5 3.4 8.7 8 9.5 4.6-.8 8-4.5 8-9.5v-5z"/><path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div class="title">إدارة التعليم النسائي</div>
        <div style="font-size:0.85rem;color:#8a7d76;margin-top:6px;">مكتب إشراف الداخل </div>
      </a>
    </div>

    <div class="contact-card hidden" id="contactCard">
      <h2 class="contact-title">تواصل</h2>
      <div class="contact-list" id="contactList"></div>
    </div>
  </div>
  <script>
    var url = (typeof FURQAN_LOGO_URL !== 'undefined') ? FURQAN_LOGO_URL : '';
    var img = document.getElementById('brandLogo');
    var dot = document.getElementById('brandDot');
    if (url && img) {
      img.src = url;
      img.onload = function () { img.classList.remove('hidden'); if (dot) dot.classList.add('hidden'); };
    }

    /* ---------- تواصل ---------- */
    (function () {
      var C = (typeof FURQAN_CONTACTS !== 'undefined') ? FURQAN_CONTACTS : {};
      var WA_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.8 14.09c-.24.68-1.42 1.3-1.95 1.34-.5.05-.97.23-3.27-.68-2.77-1.09-4.52-3.93-4.66-4.11-.13-.18-1.11-1.48-1.11-2.82 0-1.34.7-2 .95-2.27.25-.27.54-.34.72-.34h.52c.17 0 .39-.06.61.47.24.56.79 1.93.86 2.07.07.14.11.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.2 1.36.27.14.43.11.59-.07.16-.18.68-.79.86-1.07.18-.27.36-.23.61-.14.25.09 1.59.75 1.86.89.27.14.45.2.52.32.07.11.07.66-.17 1.33z"/></svg>';
      var MAIL_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>';

      function esc(t) { return String(t || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      function waNumber(raw) {
        var d = String(raw || '').replace(/[٠-٩]/g, function (x) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(x); }).replace(/\D/g, '');
        if (d.indexOf('00') === 0) d = d.slice(2);
        if (d.indexOf('05') === 0 && d.length === 10) d = '966' + d.slice(1);
        else if (d.indexOf('5') === 0 && d.length === 9) d = '966' + d;
        return d;
      }
      function waItem(role, name, phone) {
        var n = waNumber(phone);
        if (!n) return '';
        return '<a class="contact-item" href="https://wa.me/' + n + '" target="_blank" rel="noopener">' +
          '<span class="c-ic wa">' + WA_SVG + '</span>' +
          '<span class="c-txt"><span class="c-role">' + esc(role) + '</span>' +
          (name ? '<span class="c-name">' + esc(name) + '</span>' : '') +
          '<span class="c-val">' + esc(phone) + '</span></span></a>';
      }
      var html = '';
      html += waItem('رئيسة الوحدة', C.headName, C.headPhone);
      html += waItem('مساعدة الوحدة', C.assistantName, C.assistantPhone);
      if (C.unitEmail) {
        html += '<a class="contact-item" href="mailto:' + encodeURIComponent(C.unitEmail).replace(/%40/g, '@') + '">' +
          '<span class="c-ic mail">' + MAIL_SVG + '</span>' +
          '<span class="c-txt"><span class="c-role">إيميل الوحدة</span>' +
          '<span class="c-val">' + esc(C.unitEmail) + '</span></span></a>';
      }
      if (html) {
        document.getElementById('contactList').innerHTML = html;
        document.getElementById('contactCard').classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
