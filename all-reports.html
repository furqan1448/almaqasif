<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كل التقارير | نظام توثيق الأداء - فرقان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  .report-row { background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-card); cursor:pointer; transition:.2s; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .report-row:hover { box-shadow:var(--shadow-card-hover); transform:translateY(-2px); }
  .report-row .title { font-weight:700; color:var(--maroon-900); }
  .report-row .meta { font-size:.82rem; color:var(--text-muted); }
  .search-box { margin-bottom:20px; }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="page-wrap" style="max-width:900px;">
  <div class="page-header">
    <p><a href="../dashboard.html"><i class="fa-solid fa-arrow-right"></i> رجوع للوحة التحكم</a></p>
    <h2><i class="fa-solid fa-folder-open"></i> كل التقارير</h2>
    <p>اضغطي على أي تقرير لعرضه كاملاً.</p>
  </div>

  <input type="text" class="form-control search-box" id="searchBox" placeholder="ابحثي باسم الوحدة أو معدة التقرير...">

  <div id="reportsList">
    <div class="loading-box text-center p-5"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
  </div>
</div>

<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { db } from "../js/firebase/config.js";
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { STATUS_LABELS_AR } from "../js/firebase/workflow.js";

  let allReports = [];
  let currentUid = null;

  requireAuth(async (profile) => {
    currentUid = profile.uid;
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    await loadAll(profile);
    document.getElementById("searchBox").addEventListener("input", (e) => render(e.target.value));
  });

  async function loadAll(profile) {
    const isAdmin = profile.role === "education_admin";
    const snap = await getDocs(collection(db, "reports"));
    allReports = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      // "كل التقارير" (كل الوحدات، كل الحالات) يشوفها الأدمن (education_admin) بس.
      // أي دور ثاني يشوف تقاريره هو فقط بكل حالاتها.
      .filter(r => isAdmin || r.ownerUid === currentUid)
      .sort((a, b) => (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0));
    render("");
  }

  function render(filterText) {
    const list = document.getElementById("reportsList");
    const filtered = allReports.filter(r => {
      const bd = r.basicData || {};
      const haystack = `${bd.unitName || ""} ${bd.departmentName || ""} ${bd.preparerName || ""}`.toLowerCase();
      return haystack.includes(filterText.toLowerCase());
    });

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>لا توجد تقارير مطابقة.</p></div>`;
      return;
    }

    list.innerHTML = filtered.map(r => {
      const bd = r.basicData || {};
      const status = r.status || "draft";
      const statusLabel = STATUS_LABELS_AR[status] || status;
      return `
        <div class="report-row" data-id="${r.id}">
          <div>
            <div class="title">${r.reportNumber ? `تقرير رقم ${r.reportNumber} — ` : ""}${bd.unitName || bd.departmentName || "بدون اسم وحدة"}</div>
            <div class="meta">
              معدة التقرير: ${bd.preparerName || "-"} ·
              الفترة: ${bd.periodType || "-"} ${bd.hijriYear || ""} ·
              المؤشرات: ${(r.indicators || []).length} · البرامج: ${(r.programs || []).length}
            </div>
          </div>
          <span class="status-pill ${statusClass(status)}">${statusLabel}</span>
        </div>`;
    }).join("");

    list.querySelectorAll(".report-row").forEach(row => {
      row.addEventListener("click", () => {
        window.location.href = `../reports/print-report.html?id=${row.getAttribute("data-id")}`;
      });
    });
  }

  function statusClass(status) {
    if (status === "approved") return "done";
    if (status === "returned" || status === "rejected") return "fail";
    if (status === "draft") return "none";
    return "warn";
  }
</script>
</body>
</html>
