<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير الأداء | جمعية فرقان لتحفيظ القرآن الكريم</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/main.css">
<style>
  body { background: #fff; }
  .report-doc { max-width: 900px; margin: 0 auto; padding: 30px; }
  .report-header { display:flex; align-items:center; justify-content:space-between; border-bottom:4px solid var(--gold-500); padding-bottom:18px; margin-bottom:24px; }
  .report-header .logo-box { width:70px; height:70px; border-radius:50%; background:#fff; border:2px solid var(--gold-400); display:flex; align-items:center; justify-content:center; overflow:hidden; padding:5px; }
  .report-header .logo-box img { width:100%; height:100%; object-fit:contain; }
  .report-header .titles { text-align:left; }
  .report-header h1 { color:var(--maroon-900); font-size:1.3rem; margin:0; }
  .report-header p { color:var(--text-muted); font-size:.85rem; margin:0; }

  .meta-table { width:100%; border-collapse:collapse; margin-bottom:22px; font-size:.88rem; }
  .meta-table td { padding:8px 10px; border:1px solid var(--border); }
  .meta-table td.label { background:var(--gold-100); font-weight:700; width:160px; }

  .section-title { color:var(--maroon-900); font-size:1.05rem; font-weight:800; border-right:5px solid var(--gold-500); padding-right:10px; margin:26px 0 12px; }

  table.data-table { width:100%; border-collapse:collapse; font-size:.82rem; margin-bottom:14px; }
  table.data-table th { background:var(--maroon-900); color:#fff; padding:8px; text-align:right; }
  table.data-table td { padding:8px; border:1px solid var(--border); }
  table.data-table tr:nth-child(even) { background:#faf7f2; }

  .status-tag { font-size:.72rem; font-weight:700; padding:2px 8px; border-radius:999px; }
  .status-tag.done { background:#e8f6ee; color:var(--status-done); }
  .status-tag.near { background:#fbf1dd; color:var(--status-near); }
  .status-tag.warn { background:#fdece0; color:var(--status-warn); }
  .status-tag.fail { background:#fdecea; color:var(--status-fail); }
  .status-tag.none { background:#f1f1f2; color:var(--status-none); }

  .chart-box { max-width:340px; margin: 0 auto 20px; }
  .toolbar { position:sticky; top:0; background:#fff; padding:14px 0; border-bottom:1px solid var(--border); margin-bottom:20px; display:flex; justify-content:flex-end; gap:10px; z-index:10; }

  @media print {
    .toolbar, #topbar-mount { display: none !important; }
    .report-doc { padding: 0; max-width: 100%; }
    .section-title { break-after: avoid; }
    table.data-table { break-inside: avoid; }
  }
</style>
</head>
<body>

<div id="topbar-mount"></div>

<div class="toolbar page-wrap" style="max-width:900px;">
  <a href="../dashboard.html" class="btn-add" style="text-decoration:none;"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
  <button class="btn-primary" style="width:auto;padding:10px 24px;background:var(--maroon-700,#7a1f2b);" id="shareBtn">
    <i class="fa-solid fa-share-nodes"></i> إرسال إلى بريد
  </button>
  <button class="btn-primary" style="width:auto;padding:10px 24px;" onclick="window.print()">
    <i class="fa-solid fa-print"></i> طباعة / حفظ PDF
  </button>
</div>

<div class="report-doc" id="reportDoc">
  <div class="loading-box text-center p-5"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module">
  import { requireAuth } from "../js/auth.js";
  import { renderTopbar } from "../js/components/topbar.js";
  import { getOrCreateDraftReport, loadReport, shareReportWithEmail } from "../js/report-state.js";
  import { computeIndicatorStatus, STATUS_LABELS, showSaveToast } from "../js/components/form-helpers.js";

  let currentReportId;

  requireAuth(async (profile) => {
    renderTopbar(profile, { homeHref: "../dashboard.html" });
    const params = new URLSearchParams(window.location.search);
    const requestedId = params.get("id");
    currentReportId = requestedId || await getOrCreateDraftReport(profile);
    const report = await loadReport(currentReportId);
    renderReport(report);

    document.getElementById("shareBtn").addEventListener("click", onShare);
  });

  async function onShare() {
    const email = window.prompt("أدخلي البريد الإلكتروني للشخص الذي تريدين إرسال هذا التقرير له:\n(سيظهر التقرير في نظامها فور تسجيل دخولها بهذا البريد)");
    if (!email) return;
    try {
      await shareReportWithEmail(currentReportId, email);
      showSaveToast(`تم إرسال التقرير إلى ${email.trim().toLowerCase()}`);
    } catch (err) {
      console.error(err);
      showSaveToast(err.message || "تعذر الإرسال، حاولي مجددًا", true);
    }
  }

  function renderReport(r) {
    const bd = r.basicData || {};
    const indicators = r.indicators || [];
    const programs = r.programs || [];
    const strengths = r.strengths || [];
    const difficulties = r.difficulties || [];
    const recs = r.recommendations || [];
    const evidence = r.evidence || [];
    const analysis = r.resultsAnalysis || {};

    document.getElementById("reportDoc").innerHTML = `
      <div class="report-header">
        <div class="logo-box"><img src="../furqan-logo.png" alt="شعار جمعية فرقان"></div>
        <div class="titles">
          <h1>تقرير أداء دوري ${r.reportNumber ? `<span style="color:var(--gold-500);">رقم ${r.reportNumber}</span>` : ""}</h1>
          <p>جمعية فرقان لتحفيظ القرآن الكريم - الطائف</p>
        </div>
      </div>

      <table class="meta-table">
        <tr><td class="label">الجهة</td><td>${bd.departmentName || "-"} ${bd.unitName ? "/ " + bd.unitName : ""}</td>
            <td class="label">الفترة</td><td>${bd.periodType || "-"} ${bd.hijriYear || ""}</td></tr>
        <tr><td class="label">معدة التقرير</td><td>${bd.preparerName || "-"}</td>
            <td class="label">الرئيسة المباشرة</td><td>${bd.directManager || "-"}</td></tr>
        <tr><td class="label">تاريخ البداية</td><td>${bd.startDate || "-"}</td>
            <td class="label">تاريخ النهاية</td><td>${bd.endDate || "-"}</td></tr>
      </table>

      <div class="section-title">ملخص التحليل</div>
      <p>${analysis.generalSummary || "لم يُدخل خلاصة تحليل بعد."}</p>

      <div class="section-title">مؤشرات الأداء (${indicators.length})</div>
      <div class="chart-box"><canvas id="statusChart"></canvas></div>
      ${renderIndicatorsTable(indicators)}

      <div class="section-title">الأعمال والبرامج (${programs.length})</div>
      ${renderProgramsTable(programs)}

      <div class="section-title">نقاط القوة</div>
      <ul>${strengths.map(s => `<li>${s.description || ""}</li>`).join("") || "<li>لا يوجد</li>"}</ul>

      <div class="section-title">الصعوبات والتحديات</div>
      <ul>${difficulties.map(d => `<li>${d.description || ""}</li>`).join("") || "<li>لا يوجد</li>"}</ul>

      <div class="section-title">التوصيات</div>
      <ul>${recs.map(rc => `<li>${rc.text || ""}</li>`).join("") || "<li>لا يوجد</li>"}</ul>

      <div class="section-title">الشواهد والمرفقات</div>
      <ul>${evidence.map(e => `<li>${e.title || "بدون عنوان"} (${e.type || ""})</li>`).join("") || "<li>لا يوجد</li>"}</ul>
    `;

    renderChart(indicators);
  }

  function renderIndicatorsTable(indicators) {
    if (indicators.length === 0) return "<p>لا توجد مؤشرات مسجلة.</p>";
    return `<table class="data-table">
      <thead><tr><th>المؤشر</th><th>المستهدف</th><th>المتحقق</th><th>الحالة</th></tr></thead>
      <tbody>
        ${indicators.map(i => {
          const status = i.status || computeIndicatorStatus(i.baseline, i.target, i.actual, i.direction);
          return `<tr>
            <td>${i.name || "-"}</td><td>${i.target ?? "-"}</td><td>${i.actual ?? "-"}</td>
            <td><span class="status-tag ${status}">${STATUS_LABELS[status]}</span></td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>`;
  }

  function renderProgramsTable(programs) {
    if (programs.length === 0) return "<p>لا توجد أعمال مسجلة.</p>";
    return `<table class="data-table">
      <thead><tr><th>اسم العمل</th><th>الحالة</th><th>المستهدف</th><th>الفعلي</th><th>أبرز نتيجة</th></tr></thead>
      <tbody>
        ${programs.map(p => `<tr>
          <td>${p.name || "-"}</td><td>${p.executionStatus || "-"}</td>
          <td>${p.targetCount ?? "-"}</td><td>${p.actualBeneficiaries ?? "-"}</td>
          <td>${p.keyResult || "-"}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
  }

  function renderChart(indicators) {
    const counts = { done: 0, near: 0, warn: 0, fail: 0, none: 0 };
    indicators.forEach(i => {
      const status = i.status || computeIndicatorStatus(i.baseline, i.target, i.actual, i.direction);
      counts[status] = (counts[status] || 0) + 1;
    });
    new Chart(document.getElementById("statusChart"), {
      type: "doughnut",
      data: {
        labels: Object.keys(counts).map(k => STATUS_LABELS[k]),
        datasets: [{ data: Object.values(counts), backgroundColor: ["#1e8e5a","#d9a441","#e07b25","#c0392b","#9aa0a6"] }]
      },
      options: { plugins: { legend: { position: "bottom", labels: { font: { family: "Tajawal", size: 10 } } } } }
    });
  }
</script>
</body>
</html>
