<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قائمة الأسعار — وحدة المقاصف</title>
<meta name="description" content="قائمة أصناف المقصف وأسعارها، محدّثة تلقائيًا.">
<meta name="theme-color" content="#8f1d2c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   قائمة الأسعار — وحدة المقاصف
   تقرأ الأصناف والأسعار مباشرة من ورقة «قائمة الأسعار» عبر رابط نظام المقاصف نفسه
   (نفس رابط API_URL الموجود في config.js)، فلا تحتاج أي إعداد إضافي.
   العرض والتصدير من الملف المشترك price-menu.js (يجب رفعه بجانب هذه الصفحة).
   ===================================================================== */
const MENU_API_URL = "https://script.google.com/macros/s/AKfycbzHvpV3LllmNs8hb-T0-xyenzxLgnKD_UmkMDTonai56JHqcnDx1HYzXKaWc4b6BZ8j/exec";
const REFRESH_MS = 60 * 1000;   // تحديث تلقائي كل دقيقة أثناء فتح الصفحة
</script>
<script src="price-menu.js"></script>
<style>
:root{
  --red:#8f1d2c; --red-d:#6e1421; --red-soft:#f7eef0; --line:#eadcde;
  --ink:#2a2224; --muted:#857a7c; --bg:#faf6f2; --gold:#b8893a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;font-size:17px;line-height:1.7}
button,input{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

.letterhead{max-width:860px;margin:0 auto;padding:14px 16px 0}
.letterhead img{display:block;width:100%;height:auto;border-radius:14px}

.head{text-align:center;padding:30px 0 6px}
.head .unit{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:1px}
.head h1{margin:4px 0 0;font-size:40px;line-height:1.25;font-weight:800;color:var(--red)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto 10px;color:var(--gold)}
.orn i{display:block;width:70px;height:1.5px;background:currentColor;opacity:.6}
.orn b{width:7px;height:7px;transform:rotate(45deg);border:1.5px solid currentColor}
.updated{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#2e9e5e}
.dot.off{background:#c9a13b}
.dl{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.dl button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--red);background:#fff;color:var(--red);font-weight:700;
  border-radius:12px;padding:7px 18px;cursor:pointer;font-size:15px;transition:.15s}
.dl button:hover{background:var(--red);color:#fff}
.dl button:hover svg{stroke:#fff}
.dl button svg{width:18px;height:18px;stroke:var(--red)}
.dl button:disabled{opacity:.6;cursor:wait}

.bar{position:sticky;top:0;z-index:30;background:rgba(250,246,242,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 0 0;margin-top:16px}
.search{position:relative}
.search input{width:100%;border:1px solid #e3d7d9;background:#fff;border-radius:12px;padding:10px 42px 10px 40px;font-size:16px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.search svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.search .clear{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);
  width:30px;height:30px;border-radius:50%;cursor:pointer;display:none;font-size:20px;line-height:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:30px;padding:5px 14px;
  cursor:pointer;font-weight:700;font-size:15px;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--red)}
.tab.active{background:var(--red);color:#fff}

main{padding:18px 0 40px}
.state{text-align:center;padding:50px 16px;color:var(--muted)}
.state h3{color:var(--ink);margin:0 0 4px;font-size:19px}
.btn{border:0;background:var(--red);color:#fff;font-weight:700;border-radius:10px;padding:9px 24px;cursor:pointer;margin-top:12px}
.skel-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.skel{height:14px;border-radius:7px;margin:14px 0;background:linear-gradient(90deg,#efe7e7 25%,#f7f2f2 50%,#efe7e7 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

footer{text-align:center;color:#a09597;font-size:13px;padding:4px 16px 34px}
.totop{position:fixed;left:16px;bottom:18px;z-index:40;width:44px;height:44px;border-radius:50%;border:0;background:var(--red);
  box-shadow:0 4px 12px rgba(143,29,44,.3);cursor:pointer;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.2s}
.totop.show{opacity:1;pointer-events:auto}
.totop svg{width:20px;height:20px;stroke:#fff}

@media (max-width:640px){
  body{font-size:16px}
  .letterhead{padding:10px 10px 0}.letterhead img{border-radius:10px}
  .head{padding-top:22px}.head h1{font-size:32px}
  .pm-cat{scroll-margin-top:122px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>

<div class="letterhead"><img src="furqan-letterhead.jpg" alt="جمعية فرقان لتحفيظ القرآن الكريم"></div>

<div class="wrap">
  <header class="head">
    <div class="unit">وحدة المقاصف</div>
    <h1>قائمة الأسعار</h1>
    <div class="orn"><i></i><b></b><i></i></div>
    <div class="updated"><span class="dot" id="dot"></span><span id="updatedText">جارٍ تحميل القائمة...</span></div>
    <div class="dl">
      <button type="button" id="dlPdf"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v6M9 15l3 3 3-3"/></svg>تحميل PDF</button>
      <button type="button" id="dlXlsx"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>تحميل Excel</button>
    </div>
  </header>
</div>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" enterkeyhint="search" placeholder="ابحثي عن صنف..." autocomplete="off" aria-label="البحث عن صنف">
      <button class="clear" id="clear" aria-label="مسح البحث">×</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="التصنيفات"></nav>
  </div>
</div>

<div class="wrap">
  <main id="menu">
    <div class="skel-card"><div class="skel" style="width:30%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div>
  </main>
</div>

<footer>الأسعار بالريال السعودي، وتُحدَّث تلقائيًا عند تعديل قائمة الأسعار.</footer>

<button class="totop" id="totop" aria-label="العودة إلى الأعلى">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>
</button>

<script>
const AR = s => String(s).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let RAW = [], CATS = [], lastOk = 0;

async function fetchMenu() {
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 15000);
      const res = await fetch(MENU_API_URL + "?action=getPriceItems&_=" + Date.now(), { signal: ctrl.signal });
      clearTimeout(t);
      const data = await res.json();
      if (!data || !data.ok || !Array.isArray(data.items)) throw new Error("bad");
      return data.items;
    } catch (e) { lastErr = e; await new Promise(r => setTimeout(r, 800 * (attempt + 1))); }
  }
  throw lastErr || new Error("network");
}

const $menu = document.getElementById("menu"), $tabs = document.getElementById("tabs");
const $q = document.getElementById("q"), $clear = document.getElementById("clear");

function renderTabs() {
  $tabs.innerHTML = `<button class="tab active" data-target="top">الكل</button>` +
    CATS.map((c, i) => `<button class="tab" data-target="cat-${i}">${esc(c.name)}</button>`).join("");
}
function renderMenu() {
  $clear.style.display = $q.value ? "block" : "none";
  PriceMenu.render($menu, RAW, {
    query: $q.value, idPrefix: "cat-",
    emptyText: RAW.length ? "لم نجد صنفًا يطابق «" + $q.value + "»." : "لم تُضف أصناف إلى قائمة الأسعار بعد."
  });
  observeSections();
}
function setUpdated(text, ok) {
  document.getElementById("updatedText").textContent = text;
  document.getElementById("dot").classList.toggle("off", !ok);
}
const timeLabel = d => AR(d.toLocaleTimeString("ar-SA-u-nu-latn", { hour: "numeric", minute: "2-digit" }));

function apply(items) {
  const sig = JSON.stringify(items);
  if (sig === apply._sig) return;
  apply._sig = sig;
  RAW = items; CATS = PriceMenu.group(items);
  renderTabs(); renderMenu();
}
async function load() {
  try {
    const items = await fetchMenu();
    apply(items);
    lastOk = Date.now();
    try { localStorage.setItem("maqasif_menu_cache", JSON.stringify({ t: lastOk, items })); } catch (_) {}
    setUpdated("محدّثة تلقائيًا — آخر تحديث " + timeLabel(new Date()), true);
  } catch (e) {
    if (RAW.length) {
      setUpdated("تعذّر التحديث الآن، المعروض آخر نسخة محفوظة", false);
    } else {
      $menu.innerHTML = `<div class="state"><h3>تعذّر تحميل القائمة</h3>تحقّقي من الاتصال بالإنترنت ثم أعيدي المحاولة.<br><button class="btn" id="retry">إعادة المحاولة</button></div>`;
      document.getElementById("retry").onclick = () => { $menu.innerHTML = '<div class="state">جارٍ التحميل...</div>'; load(); };
      setUpdated("غير متصلة", false);
    }
  }
}

/* التحميل */
function busy(btn, on, label) { btn.disabled = on; if (label) btn.lastChild.textContent = label; }
document.getElementById("dlPdf").onclick = async e => {
  const b = e.currentTarget; if (!RAW.length) return;
  busy(b, true, "جارٍ التجهيز..."); await PriceMenu.exportPdf(RAW); busy(b, false, "تحميل PDF");
};
document.getElementById("dlXlsx").onclick = async e => {
  const b = e.currentTarget; if (!RAW.length) return;
  busy(b, true, "جارٍ التجهيز..."); await PriceMenu.exportExcel(RAW); busy(b, false, "تحميل Excel");
};

/* التفاعل */
$tabs.addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  if ($q.value) { $q.value = ""; renderMenu(); }
  const t = b.dataset.target;
  if (t === "top") window.scrollTo({ top: 0, behavior: "smooth" });
  else document.getElementById(t)?.scrollIntoView({ behavior: "smooth", block: "start" });
  setActive(t);
});
function setActive(t) {
  $tabs.querySelectorAll(".tab").forEach(c => c.classList.toggle("active", c.dataset.target === t));
  const a = $tabs.querySelector(".tab.active");
  if (a) a.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
}
let io;
function observeSections() {
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting && !$q.value) setActive(en.target.id); });
  }, { rootMargin: "-140px 0px -60% 0px" });
  document.querySelectorAll(".pm-cat[id]").forEach(s => io.observe(s));
}
$q.addEventListener("input", () => { renderMenu(); setActive("top"); });
$clear.addEventListener("click", () => { $q.value = ""; renderMenu(); $q.focus(); });

const $top = document.getElementById("totop");
window.addEventListener("scroll", () => {
  $top.classList.toggle("show", window.scrollY > 700);
  if (window.scrollY < 150 && !$q.value) setActive("top");
}, { passive: true });
$top.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

/* التشغيل: عرض فوري من آخر نسخة محفوظة، ثم تحديث من الشيت */
try {
  const c = JSON.parse(localStorage.getItem("maqasif_menu_cache") || "null");
  if (c && Array.isArray(c.items) && c.items.length) { apply(c.items); setUpdated("جارٍ التحقق من آخر الأسعار...", true); }
} catch (_) {}
load();
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - lastOk > 20000) load(); });
</script>
</body>
</html>
